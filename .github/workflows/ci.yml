name: Frontend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.x'

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validar commits y título del PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run commitlint -- --from "$PR_BASE" --to "$PR_HEAD"
          printf '%s\n' "$PR_TITLE" | npm run commitlint -- --config commitlint.config.cjs

  frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Pruebas con cobertura
        run: npm run test:coverage
      - name: Publicar reporte LCOV
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage
          if-no-files-found: error
          retention-days: 14
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  sonar:
    name: SonarQube Cloud
    needs: [commitlint, frontend]
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage
      - name: Verificar reporte de cobertura
        run: test -s coverage/lcov.info
      - name: Validar configuración Sonar
        run: |
          for name in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta configurar $name para activar SonarQube Cloud."
              exit 1
            fi
          done
          {
            printf 'sonar.projectKey=%s\n' "$SONAR_PROJECT_KEY"
            printf 'sonar.organization=%s\n' "$SONAR_ORGANIZATION"
          } >> sonar-project.properties
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
