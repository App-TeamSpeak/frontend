# La clave, organización, host y token se inyectan desde GitHub Actions.
sonar.projectName=TeamSpeak Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,.scannerwork/**
sonar.typescript.tsconfigPaths=tsconfig.app.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
